
name: Deploy Vite Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Pages assets
        run: |
          test -f dist/images/sosna-portrait.png
          test -f dist/cv/Sosna-Adugna-CV.pdf
          grep -R -q '/New-Portfolio/images/sosna-portrait.png' dist/assets
          grep -R -q '/New-Portfolio/cv/Sosna-Adugna-CV.pdf' dist/assets

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out the latest main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Refuse stale deployments
        run: |
          if [ "$GITHUB_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "::error::This workflow run is not for the latest main commit; start a new deployment from main."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
